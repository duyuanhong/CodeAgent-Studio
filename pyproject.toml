[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent-harness"
version = "0.2.1"
description = "An observable coding-agent runtime with a desktop-style Web IDE"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CodeAgent Studio contributors"}]
dependencies = [
  "anthropic",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "croniter>=2.0",
]

[project.optional-dependencies]
mcp = ["mcp"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
codeagent = "codeagent.cli:main"
codeagent-web = "codeagent.webapp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
